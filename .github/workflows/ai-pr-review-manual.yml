name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run local AI review
        shell: powershell
        env:
          LLM_ASSISTANT_URL: http://127.0.0.1:8000
          LLM_ASSISTANT_PROVIDER_ID: cloud
          LLM_ASSISTANT_MODEL: openai/gpt-4.1-mini-2025-04-14
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

          python Day31/run_pr_review.py `
            --repo-root "$env:GITHUB_WORKSPACE" `
            --project-root "$env:GITHUB_WORKSPACE" `
            --project-id "ai-advent-challenge" `
            --index-dir "$env:GITHUB_WORKSPACE/Day31/indexes" `
            --base-ref "${{ github.event.pull_request.base.sha }}" `
            --head-ref "${{ github.event.pull_request.head.sha }}" `
            --output-file "$env:GITHUB_WORKSPACE/artifacts/ai-review.md" `
            --metadata-file "$env:GITHUB_WORKSPACE/artifacts/ai-review.json"

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-pr-review
          path: artifacts/

      - name: Publish PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/artifacts/ai-review.md`, 'utf8');
            const marker = '<!-- ai-pr-review -->';
            const commentBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody,
              });
            }
